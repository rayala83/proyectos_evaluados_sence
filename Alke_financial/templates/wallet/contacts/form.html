{% extends "base.html" %}

{% block title %}Formulario Contacto{% endblock %}

{% block content %}

<div class="container d-flex justify-content-center align-items-center min-vh-100">

    <div class="login-card p-4 shadow-lg" style="max-width: 500px; width:100%;">

        <h2 class="text-center mb-4">
            {% if form.instance.id %}
                Editar Contacto
            {% else %}
                Nuevo Contacto
            {% endif %}
        </h2>

        <form method="POST">
            {% csrf_token %}

            <div class="mb-3">
                <label>Nombre</label>
                {{ form.name }}
            </div>

            <div class="mb-4">
                <label>Email</label>
                {{ form.email }}
            </div>

            <div class="d-grid gap-2">

                <button class="btn btn-login">
                    Guardar
                </button>

                <a href="{% url 'contacts' %}" class="btn btn-outline-secondary">
                    Cancelar
                </a>

            </div>

        </form>

    </div>

</div>

{% endblock %}
