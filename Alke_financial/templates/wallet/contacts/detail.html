{% extends "base.html" %}

{% block title %}Detalle Contacto{% endblock %}

{% block content %}

<div class="container d-flex justify-content-center align-items-center min-vh-100">

    <div class="login-card p-4 shadow-lg text-center" style="max-width: 500px; width:100%;">

        <h2 class="mb-4">Detalle del Contacto</h2>

        <div class="mb-3">
            <strong>Nombre:</strong><br>
            {{ contact.name }}
        </div>

        <div class="mb-4">
            <strong>Email:</strong><br>
            {{ contact.email }}
        </div>

        <div class="d-grid gap-2">

            <a href="{% url 'contact_edit' contact.id %}" class="btn btn-login">
                Editar
            </a>

            <a href="{% url 'contacts' %}" class="btn btn-outline-secondary">
                Volver
            </a>

        </div>

    </div>

</div>

{% endblock %}
