{% extends "base.html" %}

{% block title %}Transferir{% endblock %}

{% block content %}

<div class="container d-flex justify-content-center align-items-center min-vh-100">

    <div class="login-card p-4 shadow-lg" style="max-width: 500px; width:100%;">

        <h2 class="text-center mb-3">Transferir dinero</h2>

        <div class="alert alert-info text-center">
            Saldo disponible: <strong>${{ user.balance }}</strong>
        </div>

        <!-- FORM TRANSFERENCIA -->
        <form method="POST">
            {% csrf_token %}

            <input type="hidden" name="transfer" value="1">

            <div class="mb-3">
                <label>Destino</label>
                <select name="receiver" class="form-select custom-input">
                    {% for c in contacts %}
                        <option value="{{ c.id }}">
                            {{ c.name }} - {{ c.email }}
                        </option>
                    {% endfor %}
                </select>
            </div>

            <div class="mb-4">
                <label>Monto</label>
                <input type="number" step="0.01" name="amount" class="form-control custom-input">
            </div>

            <div class="d-grid gap-2">
                <button type="submit" class="btn btn-login">
                    Transferir
                </button>

                <!-- BOTÓN MODAL -->
                <button type="button" class="btn btn-outline-primary btn-sm"
                        data-bs-toggle="modal" data-bs-target="#modalUser">
                    + Agregar usuario
                </button>
            </div>

        </form>

    </div>

</div>

<!-- 🧩 MODAL CREAR USUARIO -->
<div class="modal fade" id="modalUser" tabindex="-1">
    <div class="modal-dialog">
        <div class="modal-content">

            <div class="modal-header bg-primary text-white">
                <h5 class="modal-title">Nuevo Usuario</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
            </div>

            <div class="modal-body">

                <form method="POST">
                    {% csrf_token %}

                    <input type="hidden" name="create_contact" value="1">

                    <div class="mb-2">
                        <label>Nombre</label>
                        {{ form.name }}
                    </div>

                    <div class="mb-3">
                        <label>Email</label>
                        {{ form.email }}
                    </div>

                    <button class="btn btn-primary w-100">
                        Crear usuario
                    </button>

                </form>

            </div>

        </div>
    </div>
</div>

{% endblock %}
