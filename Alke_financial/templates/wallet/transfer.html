{% extends "base.html" %}

{% block title %}Transferir{% endblock %}

{% block content %}

<div class="container d-flex justify-content-center align-items-center min-vh-100">

    <div class="login-card p-4 shadow-lg" style="max-width: 500px; width:100%;">

        <h2 class="text-center mb-3">Transferir dinero</h2>

        <div class="alert alert-info text-center">
            Saldo disponible: <strong>${{ user.balance }}</strong>
        </div>

        <!-- FORM TRANSFERENCIA -->
        <form method="POST">
            {% csrf_token %}

            <input type="hidden" name="transfer" value="1">

            <div class="mb-3">
                <label>Destino</label>
                <select name="receiver" class="form-select custom-input">
                    {% for c in contacts %}
                        <option value="{{ c.id }}">
                            {{ c.name }} - {{ c.email }}
                        </option>
                    {% endfor %}
                </select>
            </div>

            <div class="mb-4">
                <label>Monto</label>
                <input type="number" step="0.01" name="amount" class="form-control custom-input">
            </div>

            <div class="d-grid gap-2">
                <button type="submit" class="btn btn-login">
                    Transferir
                </button>

                <a href="{% url 'dashboard' %}" class="btn btn-outline-secondary">
                    Volver
                </a>
            </div>

        </form>

    </div>

</div>



{% endblock %}
