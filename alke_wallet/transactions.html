<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Historial de Movimientos</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="style/styles.css">
</head>
<body>

    <div class="container d-flex justify-content-center align-items-center min-vh-100">
        <div class="login-card p-4 shadow-lg" style="max-width: 550px;">
            <h2 class="text-center mb-4">Últimos Movimientos</h2>
            
            <div id="mensajeVacio" class="alert alert-light text-center border" style="display: none;">
                <p class="mb-0 text-muted">Aún no tienes movimientos registrados.</p>
            </div>

            <div class="scroll-area" style="max-height: 400px; overflow-y: auto;">
                <ul id="listaMovimientos" class="list-group list-group-flush">
                    </ul>
            </div>

            <div class="d-grid gap-2 mt-4">
                <a href="menu.html" class="btn btn-login">Volver al Menú</a>
                <button id="btn-limpiar" class="btn btn-outline-danger btn-sm">Limpiar Historial</button>
            </div>
        </div>
    </div>

    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script src="style/script.js""></script>
</body>
</html>
