<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Enviar Dinero</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="style/styles.css">
</head>
<body>

    <div class="container d-flex justify-content-center align-items-center min-vh-100">
        <div class="login-card p-4 shadow-lg">
            <h2 class="text-center mb-4">Enviar Dinero</h2>
            
            <div class="alert alert-info text-center py-2">
                Saldo disponible: <strong id="saldoActualDisplay">$0.00</strong>
            </div>

            <form id="formTransferencia">
                <div class="mb-3">
                    <label class="form-label">Seleccionar Contacto</label>
                    <select class="form-select custom-input" id="destinatario" required>
                        <option value="">Selecciona un contacto...</option>
                    </select>
                </div>
                
                <div class="mb-4">
                    <label class="form-label">Monto a Transferir</label>
                    <div class="input-group">
                        <span class="input-group-text">$</span>
                        <input type="number" class="form-control custom-input" id="monto" min="0.01" step="0.01" required>
                    </div>
                </div>

                <div class="d-grid gap-2">
                    <button type="submit" class="btn btn-login">Realizar Transferencia</button>
                    <button type="button" class="btn btn-outline-primary btn-sm" data-bs-toggle="modal" data-bs-target="#modalContacto">
                        + Agregar nuevo contacto
                    </button>
                    <a href="menu.html" class="btn btn-outline-secondary">Volver al Menú</a>
                </div>
            </form>
        </div>
    </div>

    <div class="modal fade" id="modalContacto" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content border-0 shadow">
                <div class="modal-header bg-primary text-white">
                    <h5 class="modal-title">Nuevo Contacto</h5>
                    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body">
                    <form id="formNuevoContacto">
                        <div class="mb-2">
                            <label class="form-label small">Nombre y Apellido</label>
                            <input type="text" class="form-control" id="nuevo-nombre" required>
                        </div>
                        <div class="mb-2">
                            <label class="form-label small">RUT</label>
                            <input type="text" class="form-control" id="nuevo-rut" required>
                        </div>
                        <div class="mb-2">
                            <label class="form-label small">Alias</label>
                            <input type="text" class="form-control" id="nuevo-alias" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label small">Banco</label>
                            <input type="text" class="form-control" id="nuevo-banco" required>
                        </div>
                        <button type="submit" class="btn btn-primary w-100">Guardar Contacto</button>
                    </form>
                </div>
            </div>
        </div>
    </div>

    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="style/script.js"></script>
</body>
</html>
