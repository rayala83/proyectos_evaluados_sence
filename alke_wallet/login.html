<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/bootstrap/4.0.0/css/bootstrap.min.css">
    <link rel="stylesheet" href="style/styles.css">
    <title>Billetera</title>

</head>
<body>
    <div class="container d-flex justify-content-center align-items-center min-vh-100">
        <div class="login-card p-4 shadow-lg ">
            <h2 class="text-center mb-4">Bienvenido</h2>
            <form id="login">
                <div class="mb-3">
                    <label for="email" class="form-label">Email</label>
                    <input type="email" class="form-control custom-input" id="email" placeholder="nombre@ejemplo.com" required>
                </div>
                <div class="mb-4">
                    <label for="password" class="form-label">Password</label>
                    <input type="password" class="form-control custom-input" id="password" placeholder="••••••••" required>
                </div>
                <button type="submit" class="btn btn-login w-100">Ingresar</button>
            </form> 
        </div>
    </div>
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script src="style/script.js"></script>

</body>
</html>
