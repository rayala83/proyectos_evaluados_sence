<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Menú Principal</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="style/styles.css">
</head>
<body>

    <div class="container d-flex justify-content-center align-items-center min-vh-100">
        <div class="login-card p-4 shadow-lg text-center">
            <h2 class="mb-4">Menú Principal</h2>

            <div class="balance-section mb-4 p-3 bg-light rounded-3 border">
                <p class="text-muted mb-1">Dinero en Cuenta</p>
                <h3 id="saldo-cuenta" class="text-primary fw-bold">$0</h3>
            </div>

            <div class="d-grid gap-3">
                <button class="btn btn-login btn-redirect" data-url="deposit.html">Depositar</button>
                <button class="btn btn-login btn-redirect" data-url="sendmoney.html">Enviar Dinero</button>
                <button class="btn btn-login btn-secondary" data-url="transactions.html">Últimos Movimientos</button>
            </div>
            
            <a href="login.html" class="d-block mt-4 text-decoration-none text-muted small">Cerrar Sesión</a>
        </div>
    </div>

    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script src="style/script.js"></script>
</body>
</html>
