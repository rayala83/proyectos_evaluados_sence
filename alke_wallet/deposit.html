<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Depositar Dinero</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="style/styles.css">
</head>
<body>

    <div class="container d-flex justify-content-center align-items-center min-vh-100">
        <div class="login-card p-4 shadow-lg">
            <h2 class="text-center mb-4">Depositar</h2>
            
            <form id="form-deposito">
                <div class="mb-4">
                    <label for="monto-deposito" class="form-label">Monto a depositar</label>
                    <div class="input-group">
                        <span class="input-group-text">$</span>
                        <input type="number" class="form-control custom-input" id="monto-deposito" placeholder="Ej: 10000" required>
                    </div>
                </div>

                <div class="d-grid gap-2">
                    <button type="submit" class="btn btn-login">Confirmar Depósito</button>
                    <a href="menu.html" class="btn btn-outline-secondary">Volver al Menú</a>
                </div>
            </form>
        </div>
    </div>

    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script src="style/script.js"></script>
</body>
</html>
